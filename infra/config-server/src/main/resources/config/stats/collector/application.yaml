server:
  port: 0

logging:
  level:
    root: INFO

grpc:
  server:
    port: 0

kafka:

  common-properties:
    bootstrap.servers: localhost:9092

  producers:

    collector:
      key.serializer: org.apache.kafka.common.serialization.LongSerializer
      value.serializer: ru.practicum.ewm.stats.kafkamodule.kafka.serializer.UserActionSerializer

  topic:
    user-actions: stats.user-actions.v1