server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:

        # ===================== STATS =====================
        - id: stats-service
          uri: lb://stats-server
          predicates:
            - Path=/hit/**,/stats/**


        # ===================== COMMENTS =====================
        - id: comments-service
          uri: lb://comment-service
          predicates:
            - Path=
              /comments/**,
              /*/events/*/comments/**,
              /*/comments/**,
              /top/**


        # ===================== REQUESTS =====================
        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=
              /users/*/requests/**,
              /requests/**


        # ===================== USERS =====================
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**


        # ===================== EVENTS =====================
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=
              /admin/events/**,
              /events/**,
              /admin/compilations/**,
              /compilations/**,
              /admin/categories/**,
              /categories/**,
              /users/*/events/**,
              /users/*/events/*/requests/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.gateway.route: INFO